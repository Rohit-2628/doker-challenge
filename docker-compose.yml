services:
  # The Decoy Vault (Container A)
  container_a:
    build: ./container_a
    ports:
      - "8001:8001"
      - "9000:9000"
    volumes:
      - auth_sync_vol:/auth_sync
    # Add the deploy block HERE, indented under the service name
    deploy:
      resources:
        limits:
          memory: 256M

  # The Real Vault (Container C)
  container_c:
    build: ./container_c
    volumes:
      - auth_sync_vol:/auth_sync
      - tmp_sock_vol:/tmp_sock
    deploy:
      resources:
        limits:
          memory: 256M

  # Container D: The Ghost Bot (Generates keys and noise)
  bot_engine:
    build: ./container_bot
    volumes:
      - auth_sync_vol:/auth_sync
      - tmp_sock_vol:/tmp_sock
    deploy:
      resources:
        limits:
          memory: 256M

  # Container B: The Player Shell (Shares the Bot's Process List)
  player_shell:
    build: ./container_b
    ports:
      - "2222:22"
    pid: "service:bot_engine"
    volumes:
      - tmp_sock_vol:/tmp_sock
      - auth_sync_vol:/auth_sync
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  auth_sync_vol:
  tmp_sock_vol:
